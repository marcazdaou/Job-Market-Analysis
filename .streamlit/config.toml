# Light theme matched to the chart palette in dashboard/app.py
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[client]
toolbarMode = "viewer"   # hide developer menu items (e.g. "Deploy") from visitors

[browser]
gatherUsageStats = false
